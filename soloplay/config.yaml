name: "SoloPlay Server"
description: "SoloPlay server-applikation med PostgreSQL support"
version: "1.0.0"
slug: "soloplay"
init: false
arch:
  - amd64
  - aarch64
ports:
  6968/tcp: 6968
ports_description:
  6968/tcp: "SoloPlay Web interface"
options:
  app_token: "Skift_Dette_Token_Til_Noget_Langt_Over_32_Tegn"
  enable_migration: true
  db_host: "core-postgressql" # eller IP på din Postgres server
  db_port: 5432
  db_name: "Soloplay"
  db_user: "app"
  db_password: "postgres-dev-password"
schema:
  app_token: str
  enable_migration: bool
  db_host: str
  db_port: int
  db_name: str
  db_user: str
  db_password: str
